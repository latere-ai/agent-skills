name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Manifests and skill frontmatter agree
        run: python3 scripts/validate.py

      - name: Cross-harness installer tests
        run: python3 -m unittest discover -s tests -v
