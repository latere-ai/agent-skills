name: Bug report
description: Report a reproducible problem with a skill, installer, or guide
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve agent-skills. Remove secrets and private repository content before submitting.
  - type: dropdown
    id: harness
    attributes:
      label: Harness
      options:
        - Claude Code
        - Codex
        - Both
        - Not harness-specific
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Plugin version, commit SHA, or installation date
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Give the smallest safe sequence that shows the problem.
      placeholder: |
        1. Install...
        2. Run...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or examples
      description: Paste relevant output after removing credentials and private data.
      render: text
